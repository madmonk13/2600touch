<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2600Touch">
  <title>2600Touch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="screen2d" width="160" height="192"></canvas>

  <!-- Full-screen touch surface, split into joystick and fire halves. -->
  <div id="surface">
    <div class="zone joy"><div class="hint"><b id="joyHintTitle">Move</b><span id="joyHintText">Touch &amp; drag on this side</span></div></div>
    <div class="zone fire"><div class="hint"><b>Fire</b><span>Tap on this side</span></div></div>
  </div>
  <div id="ripples"></div>
  <div id="dpad">
    <i class="arrow up"></i><i class="arrow right"></i><i class="arrow down"></i><i class="arrow left"></i>
    <div class="knob"></div>
  </div>

  <header id="bar">
    <button id="menuBtn" class="icon" aria-label="Settings"><span class="face">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
    </button>
    <button id="cartBtn" class="pill"><span class="face">Cart</span></button>
    <button id="selectBtn" class="pill"><span class="face">Select</span></button>
    <button id="resetBtn" class="pill"><span class="face">Reset</span></button>
  </header>

  <div id="menu" class="sheet-backdrop" hidden>
    <div class="sheet settings-sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <div class="sheet-head">
        <h1 id="menuTitle">2600<span>Touch</span></h1>
        <button id="closeMenu" class="icon" aria-label="Close">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <section class="sec-controls">
        <h2>Controls</h2>
        <label class="switch"><span>Left-handed<small>Fire on the left, joystick on the right</small></span><input id="leftHanded" type="checkbox"><i></i></label>
        <div class="field inline">
          <span>Controller</span>
          <div class="seg" id="ctrlSeg">
            <button data-ctrl="8">8-way</button>
            <button data-ctrl="4">4-way</button>
            <button data-ctrl="paddle">Paddle</button>
          </div>
        </div>
        <label class="field slider"><span>D-pad size <output id="dpadSizeVal"></output></span>
          <input id="dpadSize" type="range" min="90" max="220" step="10"></label>
        <label class="switch" id="hapticsRow"><span>Vibrate on fire</span><input id="haptics" type="checkbox"><i></i></label>
        <label class="switch"><span>Show zone hints</span><input id="hints" type="checkbox"><i></i></label>
      </section>

      <section class="sec-sound">
        <h2>Sound</h2>
        <label class="switch"><span>Sound</span><input id="sound" type="checkbox"><i></i></label>
      </section>

      <section class="sec-console">
        <h2>Console</h2>
        <label class="switch"><span>Color<small>Off = black &amp; white switch</small></span><input id="colorMode" type="checkbox" checked><i></i></label>
        <label class="switch"><span>Left difficulty A</span><input id="diff0" type="checkbox"><i></i></label>
        <label class="switch"><span>Right difficulty A</span><input id="diff1" type="checkbox"><i></i></label>
        <div class="row"><button id="powerBtn">Power cycle</button></div>
      </section>

    </div>
  </div>

  <div id="cartsMenu" class="sheet-backdrop" hidden>
    <div class="sheet carts-sheet" role="dialog" aria-modal="true" aria-labelledby="cartsTitle">
      <div class="sheet-head">
        <h1 id="cartsTitle">Cartridges</h1>
        <button id="closeCarts" class="icon" aria-label="Close">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <section class="sec-cartridges">
        <button id="loadBtn" class="primary wide">Add cartridge…</button>
        <input id="romFile" type="file" hidden>
        <ul id="library" class="carts"></ul>
        <p id="libraryInfo" class="hint"></p>
      </section>
    </div>
  </div>

  <div id="loading" class="show" role="status" aria-live="polite">
    <div class="card">
      <div class="cart-slot"><div class="cart-chip"></div></div>
      <div class="label">Loading</div>
      <div id="loadingName" class="name">2600Touch</div>
    </div>
  </div>
  <div id="toast" role="status"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
